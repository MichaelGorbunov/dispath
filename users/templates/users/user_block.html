{% extends "mailing/base.html" %}

{% block content %}
<h4>Редактирование пользователя</h4>

  <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Сохранить</button>
          <a href="{% url 'users:user_list' %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
