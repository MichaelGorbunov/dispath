<!-- category_form.html -->
{% extends 'catalog/base.html' %}

{% block title %}Добавить/Редактировать категорию{% endblock %}

{% block content %}

<h2>{{ view.title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    {% comment %}
    <ul>
    {% for product in products %}
    <li>{{product.name}}</li>
    {% endfor %}
    </ul>
    {%endcomment%}
    <a href="{% url 'catalog:categoryes_list' %}" class="btn btn-secondary">Отмена</a>

</form>
{% endblock %}
