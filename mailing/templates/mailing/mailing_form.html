<!-- recipient_form.html -->
{% extends 'mailing/base.html' %}

{% block title %}Добавить/Редактировать рассылки{% endblock %}

{% block content %}
{% if object%}
<h4>Редактирование рассылки</h4>
{% else %}
<h4>Создание рассылки</h4>
{% endif %}


<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailing:base' %}" class="btn btn-secondary">Отмена</a>

</form>
{% endblock %}
